name: Debug with vscode

on:
  workflow_dispatch:
    inputs:
      os_preset:
        type: choice
        description: "Select runner OS. Labels: https://docs.github.com/en/actions/reference/runners/github-hosted-runners"
        required: true
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest
          - windows-latest

      os_custom:
        type: string
        description: "Custom runs-on label; overrides dropdown when non-empty"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  playground:
    runs-on: ${{ inputs.os_custom || inputs.os_preset }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Start VS Code Tunnel
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-*)     os="cli-linux-x64";    ext="tar.gz"; exe="./code" ;;
            macOS-X64)   os="cli-darwin-x64";   ext="tar.gz"; exe="./code" ;;
            macOS-ARM64) os="cli-darwin-arm64"; ext="tar.gz"; exe="./code" ;;
            Windows-*)   os="cli-win32-x64";    ext="zip";    exe="./code.exe" ;;
            *) echo "unsupported: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac

          curl -L "https://code.visualstudio.com/sha/download?build=stable&os=$os" -o "vscode-cli.$ext"

          if [[ "$ext" == "zip" ]]; then
            unzip -q "vscode-cli.$ext"
          else
            tar -xf "vscode-cli.$ext"
          fi

          "$exe" tunnel \
            --name "gha-${{ github.run_id }}-${{ github.run_attempt }}" \
            --accept-server-license-terms
